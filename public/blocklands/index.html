<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blocklands Survival · Galaxy V2.8.1</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0e12;color:#eef3eb;font-family:system-ui,"Microsoft YaHei",sans-serif}#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}small{color:#aab5aa}</style>
</head>
<body>
<div id="loading"><div>正在载入 Blocklands Survival · Galaxy V2.8.1…<br><small>手机端首次打开需要下载游戏资源。</small></div></div>
<script>
(async()=>{
  try{
    if(!window.DecompressionStream)throw new Error("当前浏览器版本过旧，请升级 Chrome / Edge / Safari / Firefox 后重试。");
    const names=["payload-g281-1.txt","payload-g281-2.txt","payload-g281-3.txt","payload-g281-4.txt","payload-g281-5.txt","payload-g281-6.txt","payload-g281-7.txt"];
    const texts=await Promise.all(names.map(n=>fetch(n,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n+" 加载失败: "+r.status);return r.text()})));
    const b64=texts.map(s=>s.trim()).join("");
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById("loading").innerHTML="载入失败<br><small>"+String(err.message||err)+"</small>";
    console.error(err);
  }
})();
</script>
</body>
</html>
