<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050713">
<title>LUCKY//CORE · 管理控制台</title>
<style>
:root{--bg:#050713;--panel:rgba(12,18,41,.9);--line:rgba(129,170,255,.19);--cyan:#69f4ff;--violet:#9b84ff;--green:#71ffc0;--red:#ff7288;--text:#f7f9ff;--muted:#8d98b7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"SF Pro Display","Microsoft YaHei",system-ui,sans-serif}body{background:radial-gradient(circle at 10% 5%,rgba(80,100,255,.19),transparent 28%),radial-gradient(circle at 90% 15%,rgba(71,235,255,.11),transparent 24%),linear-gradient(#070918,#04060f);padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(135,163,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(135,163,255,.05) 1px,transparent 1px);background-size:26px 26px}.shell{position:relative;z-index:2;width:min(1040px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 15px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border:1px solid rgba(105,244,255,.4);border-radius:12px;display:grid;place-items:center;color:var(--cyan);font-weight:1000}.brand b{font-size:13px;letter-spacing:.15em}.brand small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.back{font-size:9px;color:#aebbe0;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.panel{margin-top:18px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(180deg,rgba(15,22,49,.9),rgba(7,10,25,.86));box-shadow:0 24px 70px rgba(0,0,0,.36);backdrop-filter:blur(14px)}.login{width:min(460px,100%);margin:60px auto 0;padding:28px}.eyebrow{font-size:8px;letter-spacing:.24em;color:var(--cyan)}h1{font-size:31px;margin:7px 0 6px}p{font-size:9px;line-height:1.65;color:var(--muted);margin:0}.field{margin-top:14px}.field label{display:block;font-size:8px;color:#9ba7c6;margin:0 0 6px}.field input{width:100%;height:49px;border-radius:14px;border:1px solid rgba(130,160,235,.23);background:rgba(3,7,20,.7);color:#fff;padding:0 14px;font-size:14px;outline:none}.field input:focus{border-color:rgba(105,244,255,.5);box-shadow:0 0 0 3px rgba(105,244,255,.05)}button{cursor:pointer}.primary{width:100%;margin-top:15px;height:50px;border:0;border-radius:14px;background:linear-gradient(120deg,#69f4ff,#8d84ff 58%,#d175ff);color:#050713;font-size:12px;font-weight:1000;letter-spacing:.1em}.msg{min-height:38px;margin-top:10px;padding:10px;border:1px solid rgba(130,160,230,.12);border-radius:12px;background:rgba(4,7,18,.45);font-size:9px;line-height:1.6;color:#98a5c5}.msg.bad{color:#ff95a5;border-color:rgba(255,114,136,.2)}.msg.ok{color:var(--green);border-color:rgba(113,255,192,.2)}
#dash{display:none}.dashhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 22px 0}.dashhead h1{margin:5px 0}.status{font-size:8px;color:var(--green);border:1px solid rgba(113,255,192,.2);padding:7px 9px;border-radius:999px}.grid{display:grid;grid-template-columns:330px 1fr;gap:15px;padding:18px 22px 22px}.creator,.codes{border:1px solid rgba(130,160,230,.13);border-radius:18px;background:rgba(4,7,19,.48);padding:15px}.creator h2,.codes h2{font-size:13px;margin:0 0 4px}.preset{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.preset button{height:36px;border-radius:10px;border:1px solid rgba(130,160,230,.18);background:rgba(255,255,255,.035);color:#dce6ff;font-size:9px}.preset button.active{border-color:rgba(105,244,255,.5);color:var(--cyan);background:rgba(105,244,255,.07)}.chance-row{display:flex;gap:8px;margin-top:9px}.chance-row input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid rgba(130,160,230,.22);background:#070b1a;color:#fff;padding:0 12px;font-size:15px}.chance-row button{width:110px;border:0;border-radius:12px;background:linear-gradient(120deg,#69f4ff,#9384ff);color:#050713;font-weight:900}.generated{margin-top:13px;padding:12px;border:1px dashed rgba(105,244,255,.25);border-radius:13px;background:rgba(105,244,255,.04);display:none}.generated small{font-size:8px;color:var(--muted)}.generated code{display:block;font-size:20px;font-weight:900;letter-spacing:.12em;color:#fff;margin-top:6px;word-break:break-all}.copy{margin-top:9px;height:36px;border:1px solid rgba(105,244,255,.25);border-radius:10px;background:rgba(105,244,255,.06);color:#bdfaff;font-size:9px;width:100%}.codes-head{display:flex;justify-content:space-between;align-items:center}.refresh{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#b9c5e2;border-radius:9px;padding:6px 8px;font-size:8px}.list{margin-top:10px;display:grid;gap:7px;max-height:460px;overflow:auto}.row{display:grid;grid-template-columns:minmax(120px,1fr) 70px 78px 64px;gap:7px;align-items:center;padding:9px;border:1px solid rgba(130,160,230,.1);border-radius:12px;background:rgba(3,6,17,.45);font-size:8px}.row code{font-size:10px;color:#e8edff}.pill{display:inline-block;text-align:center;padding:5px 6px;border-radius:999px}.active-pill{color:var(--green);background:rgba(113,255,192,.06);border:1px solid rgba(113,255,192,.18)}.used-pill{color:#8c97b5;background:rgba(255,255,255,.03);border:1px solid rgba(140,151,181,.14)}.revoke{border:1px solid rgba(255,114,136,.2);background:rgba(255,114,136,.05);color:#ff9cac;border-radius:8px;padding:6px;font-size:8px}.logout{margin-top:13px;width:100%;height:38px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.025);color:#9aa5c2;font-size:9px}
@media(max-width:760px){.login{margin-top:30px;padding:20px}.dashhead{padding:16px 14px 0}.grid{grid-template-columns:1fr;padding:13px 14px 16px}.row{grid-template-columns:1fr 48px 68px}.row .date{display:none}.creator,.codes{padding:13px}.preset{grid-template-columns:repeat(5,1fr)}.chance-row{flex-direction:column}.chance-row button{width:100%;height:44px}.brand small{display:none}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><div class="logo">A</div><div><b>LUCKY//ADMIN</b><small>MANAGEMENT CONSOLE</small></div></div><a class="back" href="./">返回抽奖页</a></header>
<section class="panel login" id="login"><div class="eyebrow">AUTHORIZED ACCESS ONLY</div><h1>管理者登录</h1><p>登录后可生成一次性兑换码，并指定该兑换码可增加的抽奖次数。</p><div class="field"><label>登录账号</label><input id="user" autocomplete="username" placeholder="请输入管理者账号"></div><div class="field"><label>登录密码</label><input id="pass" type="password" autocomplete="current-password" placeholder="请输入密码"></div><button class="primary" id="loginBtn">安全登录</button><div class="msg" id="loginMsg">管理会话仅保存在当前标签页。</div></section>
<section class="panel" id="dash"><div class="dashhead"><div><div class="eyebrow">LIVE CODE CONTROL</div><h1>兑换码控制台</h1><p>生成的兑换码全局仅可成功兑换一次；用户兑换成功后状态会自动变为“已使用”。</p></div><div class="status">● LIVE</div></div><div class="grid"><div class="creator"><h2>生成兑换码</h2><p>选择或输入要增加的抽奖次数。</p><div class="preset" id="preset"><button data-n="1">1</button><button data-n="3">3</button><button data-n="5" class="active">5</button><button data-n="10">10</button><button data-n="20">20</button></div><div class="chance-row"><input id="chances" type="number" min="1" max="999" value="5"><button id="genBtn">生成兑换码</button></div><div class="generated" id="generated"><small>最新生成 · <span id="genTimes"></span> 次</small><code id="newCode"></code><button class="copy" id="copyBtn">复制兑换码</button></div><div class="msg" id="genMsg">等待生成。</div><button class="logout" id="logout">退出管理会话</button></div><div class="codes"><div class="codes-head"><div><h2>实时兑换状态</h2><p>每 2 秒自动刷新一次。</p></div><button class="refresh" id="refresh">立即刷新</button></div><div class="list" id="list"><div class="msg">正在读取…</div></div></div></div></section></div>
<script>
const API='https://mvbjhesgjwcyzqavqoyv.supabase.co/functions/v1/lottery-admin';let token=sessionStorage.getItem('lotteryAdminToken')||'';let timer=null;const $=id=>document.getElementById(id);async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({ok:false,error:'服务器响应异常'}));if(!r.ok||!d.ok)throw new Error(d.error||'请求失败');return d}
function showDash(){ $('login').style.display='none';$('dash').style.display='block';startPolling()}function showLogin(){clearInterval(timer);timer=null;$('dash').style.display='none';$('login').style.display='block'}
async function login(){const u=$('user').value.trim(),p=$('pass').value;$('loginMsg').className='msg';$('loginMsg').textContent='正在验证…';try{const d=await call({action:'admin_login',username:u,password:p});token=d.token;sessionStorage.setItem('lotteryAdminToken',token);$('pass').value='';showDash();await loadCodes()}catch(e){$('loginMsg').className='msg bad';$('loginMsg').textContent=e.message}}$('loginBtn').onclick=login;$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('preset').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#preset button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('chances').value=b.dataset.n});$('chances').addEventListener('input',()=>document.querySelectorAll('#preset button').forEach(x=>x.classList.toggle('active',x.dataset.n===$('chances').value)));
async function generate(){let n=Math.max(1,Math.min(999,Math.floor(Number($('chances').value)||1)));$('chances').value=n;$('genMsg').className='msg';$('genMsg').textContent='正在生成安全兑换码…';try{const d=await call({action:'generate_code',token,chances:n});$('generated').style.display='block';$('newCode').textContent=d.item.code;$('genTimes').textContent=d.item.chances;$('genMsg').className='msg ok';$('genMsg').textContent='生成成功。该兑换码尚未使用。';await loadCodes()}catch(e){if(String(e.message).includes('会话'))logout();else{$('genMsg').className='msg bad';$('genMsg').textContent=e.message}}}$('genBtn').onclick=generate;
$('copyBtn').onclick=async()=>{const c=$('newCode').textContent;if(!c)return;try{await navigator.clipboard.writeText(c);$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制兑换码',1200)}catch(_){$('copyBtn').textContent='请长按复制'}};
function fmt(t){if(!t)return'—';try{return new Date(t).toLocaleString('zh-CN',{hour12:false})}catch(_){return t}}async function loadCodes(){if(!token)return;try{const d=await call({action:'list_codes',token});$('list').innerHTML=d.items.length?d.items.map(x=>`<div class="row"><code>${x.code}</code><b>+${x.chances}次</b><span class="pill ${x.active?'active-pill':'used-pill'}">${x.active?'未使用':'已使用'}</span><span class="date">${fmt(x.redeemed_at||x.created_at)}</span>${x.active?`<button class="revoke" data-code="${x.code}">作废</button>`:''}</div>`).join(''):'<div class="msg">暂无兑换码。</div>'}catch(e){if(String(e.message).includes('会话'))logout()}}
$('list').addEventListener('click',async e=>{const b=e.target.closest('.revoke');if(!b)return;if(!confirm('确定作废这个兑换码？'))return;try{await call({action:'revoke_code',token,code:b.dataset.code});await loadCodes()}catch(e){alert(e.message)}});$('refresh').onclick=loadCodes;function startPolling(){clearInterval(timer);timer=setInterval(loadCodes,2000)}function logout(){sessionStorage.removeItem('lotteryAdminToken');token='';showLogin()}$('logout').onclick=logout;
if(token){showDash();loadCodes()}else showLogin();
</script>
</body></html>
