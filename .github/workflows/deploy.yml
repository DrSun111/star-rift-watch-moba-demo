name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject latest lottery runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'v2.html'):
              p = Path('dist/quantum-lottery') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              tag = '<script src="./probability-v6.js?v=20260821-1726"></script>'
              if 'probability-v6.js' not in s:
                  s = s.replace('</body>', tag + '</body>')
              else:
                  import re
                  s = re.sub(r'<script src="\./probability-v6\.js\?v=[^"]+"></script>', tag, s)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
