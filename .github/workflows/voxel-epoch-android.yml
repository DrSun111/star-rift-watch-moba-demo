name: Build Voxel Epoch Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/voxel-epoch/**'
      - 'scripts/build-voxel-mobile.mjs'
      - 'scripts/patch-voxel-android.mjs'
      - 'capacitor.config.json'
      - '.github/voxel-assets/**'
      - '.github/workflows/voxel-epoch-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/voxel-epoch/**'
      - 'scripts/build-voxel-mobile.mjs'
      - 'scripts/patch-voxel-android.mjs'
      - 'capacitor.config.json'
      - '.github/voxel-assets/**'
      - '.github/workflows/voxel-epoch-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Prepare fully offline game assets
        run: node scripts/build-voxel-mobile.mjs

      - name: Verify Android web package is offline
        run: |
          test -f mobile-dist/index.html
          test -f mobile-dist/build-info.json
          grep -q '正在进入许总的世界' mobile-dist/index.html
          if grep -R -E 'cdn\.jsdelivr\.net|unpkg\.com|threejs\.org' mobile-dist; then
            echo 'External runtime dependency detected in mobile-dist'
            exit 1
          fi
          echo 'Offline web package verification passed.'

      - name: Install Capacitor 8 build tools
        run: npm install --no-save @capacitor/cli@^8.0.0 @capacitor/core@^8.0.0 @capacitor/android@^8.0.0

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-voxel-android.mjs

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VoxelEpoch-SixRealms-Offline-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelEpoch-Android-Offline-APK
          path: VoxelEpoch-SixRealms-Offline-debug.apk
          retention-days: 30
