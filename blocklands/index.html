<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocklands Survival</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e12;color:#eef3eb;font-family:system-ui,"Microsoft YaHei",sans-serif}#loading{height:100%;display:grid;place-items:center;text-align:center}small{color:#aab5aa}</style></head><body><div id="loading"><div>正在载入 Blocklands Survival…<br><small>首次打开需下载游戏资源。</small></div></div><script>(async()=>{try{if(!window.DecompressionStream)throw new Error("浏览器不支持 DecompressionStream，请使用最新版 Chrome / Edge / Safari / Firefox。");const names=["payload-1.txt","payload-a2.txt","payload-4.txt","payload-5.txt","payload-a4.txt"];const texts=await Promise.all(names.map(n=>fetch(n,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n+" 加载失败: "+r.status);return r.text()})));const b64=texts.map(s=>s.trim()).join("");const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){document.getElementById("loading").innerHTML="载入失败<br><small>"+String(err.message||err)+"</small>";console.error(err)}})();</script></body></html>
